# Profil de stack .NET pour agent-studio.
#
# Il décrit la chaîne de ce projet — comment lancer les tests, où vivent les fichiers, comment lire
# une erreur de compilation — pour qu'aucun adaptateur écrit en TypeScript ne soit nécessaire.
id: dotnet

detect: [Tarification.sln]

# `dotnet test` ne produit pas de JUnit XML nativement : c'est le paquet JunitXml.TestLogger,
# référencé par tests/Tarification.Tests, qui l'ajoute (voir docs/adr/adr-002-*).
# La couverture sort de la MÊME exécution que les tests : `{couverture}` dit à l'outil où l'écrire.
# Elle n'est pas redondante avec la mutation — elle en est le plancher, et ce projet n'a pas d'outil
# de mutation. Sans elle, il n'aurait aucune mesure du tout.
tests:
  command:
    - dotnet
    - test
    - --nologo
    - --logger
    - "junit;LogFilePath={rapport}"
    - --collect
    - "XPlat Code Coverage;Format=cobertura"
    - --results-directory
    - "{couverture}"
  report: junit-xml
  coverage: cobertura-xml

layout:
  acceptanceTests: ["tests/**/*AcceptanceTests.cs"]
  unitTests: ["tests/**/*.cs"]
  sources: ["src/**/*.cs"]

# Ce qu'un domaine ne doit jamais importer. La lentille d'architecture s'en sert.
infrastructureModules: [Microsoft.AspNetCore, Microsoft.EntityFrameworkCore, System.Data, System.Net.Http, Dapper, Npgsql]

# C# est compilé : un symbole absent ARRÊTE la compilation, et `dotnet test` ne produit alors
# aucun rapport de tests. Sans cette section, le rouge le plus courant du cycle TDD — « la méthode
# que je viens d'appeler n'existe pas encore » — n'atteindrait jamais la porte.
#
# Format d'une erreur du compilateur C# :
#   src/Dosage.Domaine/Plafond.cs(42,9): error CS0103: Le nom 'x' n'existe pas dans le contexte actuel
#
# Le CODE d'erreur est capturé avec le message, et c'est lui qui sert à classer. Raison : les
# messages du compilateur sont TRADUITS — sur une machine française, « does not exist in the
# current context » ne matche jamais. Les codes, eux, ne changent pas d'une langue à l'autre.
buildErrors:
  pattern: '^(?<file>[^\s(]+\.cs)\(\d+,\d+\): (?<message>error \w+: .*)$'
  # Codes désignant un symbole absent : le seul échec de compilation légitime en TDD — « ce que je
  # viens d'appeler n'existe pas encore ». Tout le reste (syntaxe, types, conversions) est rejeté.
  missingSymbol:
    - "error CS0103" # le nom n'existe pas dans le contexte actuel
    - "error CS0246" # type ou espace de noms introuvable
    - "error CS0234" # le type ou espace de noms n'existe pas dans cet espace de noms
    - "error CS1061" # aucune définition pour ce membre
    - "error CS0117" # ne contient pas de définition pour
    - "error CS7036" # argument obligatoire manquant : la signature visée n'existe pas encore
    - "error CS1501" # aucune surcharge ne prend ce nombre d'arguments

# Canaris : des tests dont la bonne réponse est connue d'avance. `/stack doctor` les écrit dans une
# copie isolée du projet, lance la commande ci-dessus, et vérifie que l'échec obtenu porte le
# classement attendu. `{marque}` est remplacée par un identifiant unique.
canaries:
  - kind: passed
    file: tests/Tarification.Tests/Canari{marque}Tests.cs
    content: |
      using Xunit;
      namespace Tarification.Tests;
      public class Canari{marque}Tests
      {
          [Fact] public void Canari{marque}() => Assert.Equal(1, 1);
      }
  - kind: assertion
    file: tests/Tarification.Tests/Canari{marque}Tests.cs
    content: |
      using Xunit;
      namespace Tarification.Tests;
      public class Canari{marque}Tests
      {
          [Fact] public void Canari{marque}() => Assert.Equal(1, 2);
      }
  - kind: missing_symbol
    file: tests/Tarification.Tests/Canari{marque}Tests.cs
    content: |
      using Xunit;
      namespace Tarification.Tests;
      public class Canari{marque}Tests
      {
          [Fact] public void Canari{marque}() => MethodeAbsente{marque}();
      }
  - kind: syntax
    file: tests/Tarification.Tests/Canari{marque}Tests.cs
    content: |
      using Xunit;
      namespace Tarification.Tests;
      public class Canari{marque}Tests
      {
          [Fact] public void Canari{marque}() => :::
